<!DOCTYPE html>
<html lang="cs">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="faakt.io" />

		<title>Doomscrolling, ale lepší</title>
		<meta name="description" content="Scrolluj zajímavými historickými fakty, filozofickými myšlenkami a příběhy. TikTok pro tvou mysl." />

		<!-- Open Graph — titulek, popis a URL doplňuje +layout.svelte (per-stránka) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="faakt.io" />
		<meta property="og:locale" content="cs_CZ" />
		<meta property="og:image" content="https://lukazko.github.io/faakt.io/og-image.png" />
		<meta property="og:image:secure_url" content="https://lukazko.github.io/faakt.io/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="faakt.io" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://lukazko.github.io/faakt.io/og-image.png" />
		<meta name="twitter:image:alt" content="faakt.io" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-prerender="true">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
